```yaml
name: Update Sing Rule Sets

on:
  schedule:
    # 每天北京时间 08:00（UTC 00:00）
    - cron: "0 0 * * *"

  # 允许手动运行
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-rules:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Download rule sets
        shell: bash
        run: |
          set -e

          mkdir -p Sing

          echo "Downloading cn.srs..."
          curl -fL --retry 3 --retry-delay 5 \
            "https://gh-proxy.org/https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/sing/geo/geoip/cn.srs" \
            -o "Sing/cn_ip.srs"

          echo "Downloading private.srs (geoip)..."
          curl -fL --retry 3 --retry-delay 5 \
            "https://gh-proxy.org/https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/sing/geo/geoip/private.srs" \
            -o "Sing/private_ip.srs"

          echo "Downloading private.srs (geosite)..."
          curl -fL --retry 3 --retry-delay 5 \
            "https://gh-proxy.org/https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/sing/geo/geosite/private.srs" \
            -o "Sing/private_site.srs"

          echo
          echo "Downloaded files:"
          ls -lh \
            Sing/cn_ip.srs \
            Sing/private_ip.srs \
            Sing/private_site.srs

      - name: Show Git status
        shell: bash
        run: |
          echo "===== Git status ====="
          git status --short --untracked-files=all

          echo
          echo "===== Git tracked status ====="
          git ls-files --error-unmatch \
            Sing/cn_ip.srs \
            Sing/private_ip.srs \
            Sing/private_site.srs \
            || true

      - name: Stage rule sets
        shell: bash
        run: |
          # -f 防止 .gitignore 导致这些文件无法加入 Git
          git add -f \
            Sing/cn_ip.srs \
            Sing/private_ip.srs \
            Sing/private_site.srs

          echo "===== Staged changes ====="
          git status --short

      - name: Check for changes
        id: changes
        shell: bash
        run: |
          if git diff --cached --quiet -- \
            Sing/cn_ip.srs \
            Sing/private_ip.srs \
            Sing/private_site.srs
          then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No changes."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Rule sets changed."
          fi

      - name: Commit and push changes
        if: steps.changes.outputs.changed == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git commit -m "chore: update Sing rule sets"
          git push
```
