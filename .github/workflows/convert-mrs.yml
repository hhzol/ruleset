name: Convert Clash Rules to MRS

on:
  push:
    paths:
      - 'Clash/ad.yaml'
      - 'Clash/us.yaml'
      - 'Clash/filter.yaml'
      - '.github/workflows/convert-mrs.yml'

  workflow_dispatch:

permissions:
  contents: write

jobs:
  convert:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download latest Mihomo
        shell: bash
        run: |
          set -e

          mkdir -p "$RUNNER_TEMP/mihomo"

          echo "Getting latest Mihomo release..."

          RELEASE_JSON=$(curl -fsSL \
            --retry 3 \
            --retry-delay 2 \
            https://api.github.com/repos/MetaCubeX/mihomo/releases/latest)

          VERSION=$(echo "$RELEASE_JSON" | jq -r '.tag_name')

          if [ -z "$VERSION" ] || [ "$VERSION" = "null" ]; then
            echo "Failed to get Mihomo version"
            exit 1
          fi

          echo "Mihomo version: $VERSION"

          # Find the official Linux amd64 compressed binary.
          #
          # Prefer:
          #   mihomo-linux-amd64-*.gz
          #
          # This avoids hard-coding the exact asset filename.
          DOWNLOAD_URL=$(echo "$RELEASE_JSON" | jq -r '
            .assets[]
            | select(.name | test("^mihomo-linux-amd64-.*\\.gz$"))
            | .browser_download_url
          ' | head -n 1)

          if [ -z "$DOWNLOAD_URL" ]; then
            echo "Could not find Linux amd64 Mihomo asset."
            echo
            echo "Available Linux amd64 assets:"
            echo "$RELEASE_JSON" | jq -r '
              .assets[]
              | select(.name | test("linux-amd64"))
              | .name
            '
            exit 1
          fi

          echo "Downloading:"
          echo "$DOWNLOAD_URL"

          curl -fL \
            --retry 3 \
            --retry-delay 2 \
            -o "$RUNNER_TEMP/mihomo/mihomo.gz" \
            "$DOWNLOAD_URL"

          gzip -d "$RUNNER_TEMP/mihomo/mihomo.gz"

          chmod +x "$RUNNER_TEMP/mihomo/mihomo"

          echo
          echo "Mihomo version:"
          "$RUNNER_TEMP/mihomo/mihomo" -v

      - name: Convert ad.yaml to ad.mrs
        shell: bash
        run: |
          set -e

          if [ ! -f Clash/ad.yaml ]; then
            echo "Clash/ad.yaml does not exist"
            exit 1
          fi

          echo "Converting Clash/ad.yaml..."

          "$RUNNER_TEMP/mihomo/mihomo" \
            convert-ruleset \
            domain \
            yaml \
            Clash/ad.yaml \
            Clash/ad.mrs

          if [ ! -s Clash/ad.mrs ]; then
            echo "Clash/ad.mrs was not generated correctly"
            exit 1
          fi

          echo "Generated:"
          ls -lh Clash/ad.yaml Clash/ad.mrs

      - name: Convert us.yaml to us.mrs
        shell: bash
        run: |
          set -e

          if [ ! -f Clash/us.yaml ]; then
            echo "Clash/us.yaml does not exist"
            exit 1
          fi

          echo "Converting Clash/us.yaml..."

          "$RUNNER_TEMP/mihomo/mihomo" \
            convert-ruleset \
            domain \
            yaml \
            Clash/us.yaml \
            Clash/us.mrs

          if [ ! -s Clash/us.mrs ]; then
            echo "Clash/us.mrs was not generated correctly"
            exit 1
          fi

          echo "Generated:"
          ls -lh Clash/us.yaml Clash/us.mrs

      - name: Convert filter.yaml to filter.mrs
        shell: bash
        run: |
          set -e

          if [ ! -f Clash/filter.yaml ]; then
            echo "Clash/filter.yaml does not exist"
            exit 1
          fi

          echo "Converting Clash/filter.yaml..."

          "$RUNNER_TEMP/mihomo/mihomo" \
            convert-ruleset \
            domain \
            yaml \
            Clash/filter.yaml \
            Clash/filter.mrs

          if [ ! -s Clash/filter.mrs ]; then
            echo "Clash/filter.mrs was not generated correctly"
            exit 1
          fi

          echo "Generated:"
          ls -lh Clash/filter.yaml Clash/filter.mrs


      - name: Show generated files
        shell: bash
        run: |
          echo "========================================"
          echo "Generated MRS files"
          echo "========================================"

          ls -lh \
            Clash/ad.mrs \
            Clash/us.mrs \
            Clash/filter.mrs

      - name: Commit and push changes
        shell: bash
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            Clash/ad.mrs \
            Clash/us.mrs \
            Clash/filter.mrs

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit \
            -m "chore: update Clash MRS rulesets"

          git push
